name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["ios-jimmy-build"]

permissions:
  contents: read

concurrency:
  group: ios-personal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: iOS release IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Placeholder for project generation; code signing is disabled.
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-personal-build

      - name: Record build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version
          node --version
          pnpm --version
          git rev-parse HEAD

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS Xcode project
        run: |
          pnpm tauri ios init --ci
          python3 scripts/prepare-ios-plists.py

      - name: Build release app and unsigned IPA
        shell: bash
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bash scripts/build-ios-unsigned.sh "$VERSION"

      - name: Verify IPA and include license
        run: |
          python3 scripts/verify-ios-ipa.py artifacts/*.ipa
          cp LICENSE artifacts/LICENSE.txt

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-IPA-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-failure-${{ github.run_number }}
          path: ios-build-session.log
          retention-days: 7
          if-no-files-found: warn
